name: redpanda-cluster
networks:
  redpanda_network:
    driver: bridge

volumes:
  redpanda-0:
  redpanda-1:
  redpanda-2:
  minio:
  neo4j_data:
  neo4j_logs:
  neo4j_plugins:

services:
  redpanda-0:
    image: docker.redpanda.com/redpandadata/redpanda:v25.3.1
    container_name: redpanda-0
    command:
      - redpanda
      - start
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://redpanda-0:9092,external://localhost:19092
      - --pandaproxy-addr internal://0.0.0.0:8082,external://0.0.0.0:18082
      - --advertise-pandaproxy-addr internal://redpanda-0:8082,external://localhost:18082
      - --schema-registry-addr internal://0.0.0.0:8081,external://0.0.0.0:18081
      - --rpc-addr redpanda-0:33145
      - --advertise-rpc-addr redpanda-0:33145
      - --mode dev-container
      - --smp 1
      - --default-log-level=info
    networks:
      - redpanda_network
    volumes:
      - redpanda-0:/var/lib/redpanda/data
      - ./bootstrap.yml:/etc/redpanda/.bootstrap.yaml
    ports:
      - 18081:18081
      - 18082:18082
      - 19092:19092
      - 19644:9644
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health --exit-when-healthy || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  redpanda-1:
    image: docker.redpanda.com/redpandadata/redpanda:v25.3.1
    container_name: redpanda-1
    command:
      - redpanda
      - start
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:29092
      - --advertise-kafka-addr internal://redpanda-1:9092,external://localhost:29092
      - --rpc-addr redpanda-1:33145
      - --advertise-rpc-addr redpanda-1:33145
      - --mode dev-container
      - --smp 1
      - --seeds redpanda-0:33145
    networks:
      - redpanda_network
    volumes:
      - redpanda-1:/var/lib/redpanda/data
    ports:
      - 29092:29092
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health --exit-when-healthy || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    depends_on:
      redpanda-0:
        condition: service_healthy

  redpanda-2:
    image: docker.redpanda.com/redpandadata/redpanda:v25.3.1
    container_name: redpanda-2
    command:
      - redpanda
      - start
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:39092
      - --advertise-kafka-addr internal://redpanda-2:9092,external://localhost:39092
      - --rpc-addr redpanda-2:33145
      - --advertise-rpc-addr redpanda-2:33145
      - --mode dev-container
      - --smp 1
      - --seeds redpanda-0:33145
    networks:
      - redpanda_network
    volumes:
      - redpanda-2:/var/lib/redpanda/data
    ports:
      - 39092:39092
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health --exit-when-healthy || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    depends_on:
      redpanda-0:
        condition: service_healthy

  console:
    container_name: redpanda-console
    image: docker.redpanda.com/redpandadata/console:v3.3.2
    networks:
      - redpanda_network
    ports:
      - "8080:8080"
    environment:
      KAFKA_BROKERS: redpanda-0:9092,redpanda-1:9092,redpanda-2:9092
      KAFKA_SCHEMAREGISTRY_ENABLED: "true"
      KAFKA_SCHEMAREGISTRY_URLS: http://redpanda-0:8081
      REDPANDA_ADMINAPI_ENABLED: "false"
    depends_on:
      redpanda-0:
        condition: service_healthy

  minio:
    container_name: minio
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio:/data
    networks:
      - redpanda_network
    ports:
      - 9000:9000
      - 9001:9001

  topic-init:
    image: docker.redpanda.com/redpandadata/redpanda:v25.3.1
    container_name: redpanda-topic-init
    user: root
    depends_on:
      redpanda-0:
        condition: service_healthy
      redpanda-1:
        condition: service_healthy
      redpanda-2:
        condition: service_healthy
    networks:
      - redpanda_network
    volumes:
      - ./scripts:/scripts
    entrypoint: ["/bin/bash", "-c", "chmod +x /scripts/create_topics.sh && sleep 5 && /scripts/create_topics.sh"]

  lgtm:
    container_name: lgtm
    image: grafana/otel-lgtm:latest
    networks:
      - redpanda_network
    ports:
      - "3000:3000"
      - "4317:4317"
      - "4318:4318"
      - "3100:3100"
      - "3200:3200"
    depends_on:
      redpanda-0:
        condition: service_healthy

  neo4j:
    image: neo4j
    container_name: neo4j
    networks:
      - redpanda_network
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - neo4j_plugins:/plugins
    environment:
      NEO4J_AUTH: "none"
      NEO4J_PLUGINS: '["apoc", "graph-data-science"]'
      NEO4J_apoc_export_file_enabled: "true"
      NEO4J_apoc_import_file_enabled: "true"
      NEO4J_server_memory_pagecache_size: 1G
      NEO4J_server_memory_heap_initial__size: 1G
      NEO4J_server_memory_heap_max__size: 1G
    ports:
      - "7474:7474"
      - "7687:7687"